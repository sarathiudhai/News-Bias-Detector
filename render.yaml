services:
  - type: web
    name: bias-detector-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HF_API_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: bias-detector-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: bias-detector-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bias-detector-backend
          envVarKey: RENDER_EXTERNAL_URL
