services:
  - type: web
    name: bias-detector-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HF_API_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false  # Set this to your Vercel URL later (e.g., https://your-app.vercel.app)
